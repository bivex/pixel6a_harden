name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.yml ]; then echo "Dependencies verified"; fi
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run Python Unit Test Suite
        run: |
          python3 tests/test_config.py

      - name: Run Static Shell Linting (shellcheck)
        run: |
          shellcheck scripts/*.sh
